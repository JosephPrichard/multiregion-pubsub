services:
  redis-1:
    image: redis:7-alpine
    container_name: redis-1
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6479:6379"
    volumes:
      - redis-1-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-2:
    image: redis:7-alpine
    container_name: redis-2
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6480:6379"
    volumes:
      - redis-2-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-3:
    image: redis:7-alpine
    container_name: redis-3
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6481:6379"
    volumes:
      - redis-3-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  postgres-data: